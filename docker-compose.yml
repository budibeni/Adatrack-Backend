# ============================================================================
# ADATRACK — Canonical stack: infrastructure + monitoring
# (PRD §14.1 deployment, §10.4 observability, §7 variants)
# ============================================================================
# Services: PostgreSQL 15 · Redis 7 · NATS 2 (JetStream)
#           + monitoring (B4): Prometheus · Alertmanager · Grafana ·
#             node-exporter · cAdvisor · postgres-exporter · redis-exporter
#
# This is the SINGLE source of truth for the stack. The monitoring services used
# to live in a second file (monitoring/docker-compose.monitoring.yml) that had
# to be layered on top with `-f`; they now live here so one `up`/`down` owns the
# whole system and no stack can be left half-stopped. `monitoring/` now only
# holds the configuration these containers mount (prometheus.yml, rules,
# grafana provisioning, alertmanager.yml, generated file_sd targets).
#
# Variant selection (§7):
#   LOCAL   : backend/docker-compose.local.yml  (includes this file) + backend/.env.local
#   COOLIFY : backend/deployments/docker-compose.coolify.yml  + backend/.env.coolify
#
# Helper: backend/scripts/compose-up.sh [local|coolify] <compose args...>
#
# NOTE: MinIO (B5b Dashcam Event Media, PRD Module 8 / FR-8.1) is deliberately
# NOT here — it is a LOCAL-variant service defined in docker-compose.local.yml
# (which includes this file), so the canonical and production stacks stay free
# of object storage they do not own. The Coolify variant is self-contained and
# provisions object storage as a Coolify resource.
#
# All values fall back to safe dev defaults, so `docker compose up -d` works
# standalone while still honoring the .env variant file (see compose-up.sh).
# ============================================================================
name: adatrack_gps_system

services:
  postgres:
    image: postgres:15-alpine
    container_name: adatrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adatrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adatrack_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-adatrack_gps_db}
      # Reproducible collation for the reference seed (BPS region codes).
      LANG: C.UTF-8
    ports:
      - "${HOST_PG_PORT:-5533}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap (idempotent): schemas + master setup + company template.
      - ./database/init-pg:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/db/migrations:ro
      - ./database/seed:/db/seed:ro
      - ./scripts/pg-wait.sh:/usr/local/bin/pg-wait.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adatrack} -d ${POSTGRES_DB:-adatrack_gps_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [adatrack]

  redis:
    image: redis:7-alpine
    container_name: adatrack_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60 1"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    ports:
      - "${HOST_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [adatrack]

  nats:
    image: nats:2.10-alpine
    container_name: adatrack_nats
    restart: unless-stopped
    # JetStream is mandatory (PRD §4.1). Limits (max_file_store/max_memory_store)
    # live in deployments/nats/nats.conf so stream retention is always honoured;
    # JETSTREAM_MAX_* in the service config stays the source of truth for the
    # per-stream MaxAge/MaxBytes.
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${HOST_NATS_PORT:-4222}:4222"
      - "${HOST_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
      - ./deployments/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [adatrack]

  # ---------------------------------------------------------------------------
  # Monitoring stack (B4, PRD §10.4 / §14.1)
  #
  # Same project and network as the infra above, so the exporters talk to
  # `postgres:5432` / `redis:6379` by service name and Prometheus alerts reach
  # `alertmanager:9093` without any cross-project glue. Ports are published
  # plainly here (dev/staging default); docker-compose.local.yml re-binds them to
  # 127.0.0.1 via `!override`, and deployments/docker-compose.coolify.yml keeps
  # them on the internal network only.
  #
  # Config lives under monitoring/ (this file sits at the repo root, hence the
  # ./monitoring/... mount paths):
  #   prometheus/prometheus.yml      scrape config (file_sd + static exporters)
  #   prometheus/rules/*.yml         SLO recording + alert rules (PRD §10.3)
  #   targets/adatrack-services.json generated by scripts/gen-prom-targets.sh
  #   grafana/…                      datasource + dashboard (uid adatrack-core)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: adatrack_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${HOST_PROM_PORT:-9095}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - promdata:/prometheus
    # Host-run pipeline services (scripts/start-services.sh) listen on the host
    # loopback; `host.docker.internal` (host-gateway) makes them scrapeable from
    # inside this container. monitoring/targets/adatrack-services.json is
    # generated with PROM_SCRAPE_HOST=host.docker.internal (see `make prom-targets`).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [adatrack]
    depends_on:
      - postgres-exporter
      - redis-exporter

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: adatrack_alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "${HOST_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    networks: [adatrack]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: adatrack_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${HOST_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks: [adatrack]
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: adatrack_node_exporter
    restart: unless-stopped
    ports:
      - "${HOST_NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # NOTE: `$$` is required — Compose would otherwise interpolate $| itself.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks: [adatrack]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: adatrack_cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${HOST_CADVISOR_PORT:-8084}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [adatrack]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: adatrack_postgres_exporter
    restart: unless-stopped
    environment:
      # Reaches PostgreSQL over the shared compose network (service name), not
      # the host port — so it works identically in LOCAL and standalone.
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-adatrack}:${POSTGRES_PASSWORD:-adatrack_dev_pw}@postgres:5432/${POSTGRES_DB:-adatrack_gps_db}?sslmode=disable
    ports:
      - "${HOST_PG_EXPORTER_PORT:-9187}:9187"
    networks: [adatrack]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: adatrack_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "${HOST_REDIS_EXPORTER_PORT:-9121}:9121"
    networks: [adatrack]

volumes:
  pgdata:
  redisdata:
  natsdata:
  promdata:
  alertdata:
  grafanadata:

networks:
  adatrack:
    name: adatrack_gps_net
    driver: bridge