# =====================================================================
# Prometheus configuration — adatrack GPS Monitoring (Phase B4)
#
# Topologi dev saat ini: keenam service Go berjalan DI HOST (bind dari
# backend/.env), infra (Postgres/Redis/NATS) di container compose. Prometheus
# berjalan di container.
#
# PENTING (audit 2026-08-31): di Docker Desktop + WSL2, `host.docker.internal`
# (192.168.65.254) TIDAK merutekan ke userland distro WSL tempat service Go
# berjalan → semua target adatrack-services sempat DOWN (connection refused)
# meski service sehat. Target kini memakai IP distro WSL (hostname -I).
# IP WSL BISA berubah setelah restart Windows/WSL — perbarui daftar targets
# di bawah (atau migrasi ke file_sd yang di-generate script saat start).
#
# Port metrik aktual (backend/.env):
#   ingestion-tcp      :8090   (/metrics)
#   worker-persistence :8091
#   worker-live        :8092
#   worker-alert       :8093
#   service-websocket  :9090   (WEBSOCKET_METRICS_ADDR)
#   api-vehicle        :8081   (/metrics di server HTTP utamanya)
# =====================================================================

global:
  scrape_interval: 15s      # default scrape every 15s
  evaluation_interval: 15s  # evaluate rules every 15s

# Alerting: Alertmanager endpoint (see docker-compose.monitoring.yml)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Alerting + SLO recording rules (PRD §8.3 + B4)
rule_files:
  - /etc/monitoring/alerting-rules.yml
  - /etc/monitoring/slo-rules.yml

scrape_configs:
  # Service Go di HOST dev via FILE_SD (B4 audit 2026-08-31).
# Latar: di Docker Desktop+WSL2 `host.docker.internal` tidak menjangkau
# userland WSL2, dan IP distro WSL berubah tiap restart → targets dipindah ke
# file_sd yang di-generate `scripts/gen-prom-targets.sh` (refresh 30 dtk; file
# ter-mount read-only di /etc/monitoring/targets/).
  - job_name: "adatrack-services"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/monitoring/targets/*.json
        refresh_interval: 30s

  # Alternatif bila service dijalankan sebagai container (nama network compose).
  - job_name: "adatrack-services-containers"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "ingestion-tcp:9201"
          - "worker-persistence:9202"
          - "worker-live:9203"
          - "worker-alert:9204"
    # Target container yang tidak hidup hanya menandai up==0 utk job ini;
    # alert ServiceDown difilter ke job adatrack-services agar tidak berisik.

  - job_name: "node"  # host metrics (CPU, Mem, Disk)
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"  # per-container CPU/Memory
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "mysql"  # MySQL engine metrics
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # PostgreSQL engine + READ REPLICA metrics (slot WAL, streaming, lag).
  # Target akan tampak DOWN bila provider=mysql — itu normal (exporter
  # ber-profile "postgres"); alert PG berbasis series, bukan up==0.
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

