# ADATRACK Prometheus (B4, PRD §10). Scrape: file_sd service targets + exporters.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/adatrack-slo.yml
  - /etc/prometheus/rules/alert-rules.yml

scrape_configs:
  - job_name: adatrack-services
    file_sd_configs:
      - files: [/etc/prometheus/targets/adatrack-services.json]
        refresh_interval: 30s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
