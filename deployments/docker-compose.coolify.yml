# ============================================================================
# ADATRACK — COOLIFY variant (deploy 1-klik) — PRD §7, §14.1, §14.5
# ============================================================================
# FILE INI: backend/deployments/docker-compose.coolify.yml
#
# Cara pakai di Coolify (langkah rinci + checklist: docs/DEPLOY_COOLIFY.md):
#   1. Coolify -> + New -> Docker Compose (Git repository), pilih repo + branch.
#        Base Directory          : backend
#        Docker Compose Location : deployments/docker-compose.coolify.yml
#   2. Configuration -> Environment Variables -> Developer view -> paste SELURUH
#      isi backend/.env.coolify -> Save. (Nama KEY di bawah sengaja identik
#      dengan .env.local, jadi isi kedua file bisa dipakai bergantian.)
#   3. Isi kolom "Domains" untuk service HTTP yang perlu publik:
#        service-websocket -> port internal 8082
#        api-vehicle       -> port internal 8081
#        grafana (opsional) -> port internal 3000
#      Proxy + TLS ditangani Coolify. Port GPS device sudah di-publish otomatis.
#   4. Deploy. Tidak ada langkah lain — migrasi database jalan otomatis saat boot
#      (MIGRATE_ON_BOOT=true, ledger + advisory lock, §14.5 step 3).
#
# KENAPA TIDAK ADA `env_file: ../.env.coolify`
#   `.env.coolify` ada di .gitignore sehingga TIDAK ikut ter-clone di server
#   Coolify -> `env_file` pasti menggagalkan deploy. Karena itu seluruh parameter
#   dideklarasikan eksplisit sebagai ${KEY} di blok x-app-env di bawah: Coolify
#   mendeteksi referensi tersebut dan menampilkannya sebagai application
#   variables yang bisa dipaste sekali jalan.
#
# Keputusan arsitektur:
#   * Infra (PostgreSQL/Redis/NATS) ada DI DALAM stack ini -> satu klik, tanpa
#     resource eksternal. Data persisten lewat `volumes:`.
#   * Tanpa `container_name`: dibiarkan Coolify/Compose menamai agar bisa
#     di-prefix dan tidak bentrok antar-environment.
#   * Network tanpa `name:` hardcoded supaya Coolify bisa memberi prefix unik;
#     antar-service tetap saling menemukan lewat nama service di network yang sama.
#   * Hanya `ingestion-tcp` yang mem-publish port host (TCP device GPS wajib
#     dijangkau langsung). Service HTTP lain `expose` saja -> lewat proxy Coolify.
#   * Monitoring (B4, §10.4) internal-only; dashboard Grafana via domain proxy.
#
# JANGAN campur file ini dengan .env.local (§7 "tidak ada config campuran").
# ============================================================================
name: adatrack_staging

# ---------------------------------------------------------------------------
# x-app-env — SATU daftar env untuk semua service aplikasi (pengganti env_file).
# Dipakai sebagai `environment: *app-env`. Semua service menerima daftar yang
# sama, persis seperti perilaku env_file sebelumnya; tiap service hanya membaca
# key yang relevan baginya.
# ---------------------------------------------------------------------------
x-app-env: &app-env
  # --- logging / telemetry ---
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-20}
  # --- PostgreSQL (master + tenant; DSN diturunkan dari POSTGRES_*) ---
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # DATABASE_URL sengaja boleh kosong: DSN dibangun dari POSTGRES_* di atas.
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-20}
  POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-50}
  MASTER_DB_NAME: ${MASTER_DB_NAME:-adatrack_gps_master}
  COMPANY_DB_PREFIX: ${COMPANY_DB_PREFIX:-adatrack_gps_}
  COMPANY_MIGRATIONS_DIR: ${COMPANY_MIGRATIONS_DIR:-./database/migrations/company_pg}
  MASTER_MIGRATIONS_DIR: ${MASTER_MIGRATIONS_DIR:-./database/migrations/master_pg}
  # --- Redis ---
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-adatrack_gps:}
  REDIS_TTL_SEC: ${REDIS_TTL_SEC:-300}
  REDIS_POOL_MIN: ${REDIS_POOL_MIN:-10}
  REDIS_POOL_MAX: ${REDIS_POOL_MAX:-30}
  # --- NATS / JetStream ---
  NATS_URL: ${NATS_URL:-nats://nats:4222}
  NATS_SUBJECT_PREFIX: ${NATS_SUBJECT_PREFIX:-telemetry}
  NATS_MAX_PAYLOAD: ${NATS_MAX_PAYLOAD:-1048576}
  JETSTREAM_MAX_AGE_HOURS: ${JETSTREAM_MAX_AGE_HOURS:-48}
  JETSTREAM_MAX_BYTES: ${JETSTREAM_MAX_BYTES:-4294967296}
  # --- ingestion-tcp (GT06/Teltonika) ---
  TCP_PORT: ${TCP_PORT:-9003}
  TCP_MAX_CONNECTIONS: ${TCP_MAX_CONNECTIONS:-5000}
  TELTONIKA_TCP_PORT: ${TELTONIKA_TCP_PORT:-9011}
  GT06_DATE_BCD: ${GT06_DATE_BCD:-false}
  INGESTION_METRICS_ADDR: ${INGESTION_METRICS_ADDR:-:8090}
  # --- worker-live ---
  LIVE_METRICS_ADDR: ${LIVE_METRICS_ADDR:-:8091}
  LIVE_BATCH_INTERVAL_MS: ${LIVE_BATCH_INTERVAL_MS:-100}
  # --- worker-persistence ---
  PERSISTENCE_METRICS_ADDR: ${PERSISTENCE_METRICS_ADDR:-:8092}
  BATCH_SIZE: ${BATCH_SIZE:-500}
  BATCH_TIMEOUT_SEC: ${BATCH_TIMEOUT_SEC:-5}
  RETRY_MAX: ${RETRY_MAX:-3}
  RETRY_BACKOFF_MS: ${RETRY_BACKOFF_MS:-1000,5000,10000}
  # --- worker-alert (B3) ---
  ALERT_METRICS_ADDR: ${ALERT_METRICS_ADDR:-:8094}
  OFFLINE_AFTER_MINUTES: ${OFFLINE_AFTER_MINUTES:-3}
  FUEL_DROP_SEVERITY: ${FUEL_DROP_SEVERITY:-warning}
  NOTIFY_RATE_LIMIT_PER_MIN: ${NOTIFY_RATE_LIMIT_PER_MIN:-600}
  # Kanal email: SMTP_HOST kosong = kanal email dimatikan (PRD §7.3).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-notifications@adatrackgps.io}
  # Kanal SMS: kosong = kanal SMS dimatikan.
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID:-}
  SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
  SMS_FROM: ${SMS_FROM:-}
  # --- service-websocket / api-vehicle (HTTP) ---
  HTTP_ADDR: ${HTTP_ADDR:-:8082}
  API_VEHICLE_HTTP_ADDR: ${API_VEHICLE_HTTP_ADDR:-:8081}
  # --- JWT + auth (WAJIB sama di service-websocket & api-vehicle) ---
  JWT_SECRET: ${JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER:-adatrack}
  JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
  JWT_REFRESH_EXPIRY_HOURS: ${JWT_REFRESH_EXPIRY_HOURS:-168}
  JWT_REVOCATION_ENABLED: ${JWT_REVOCATION_ENABLED:-true}
  JWT_CLOCK_SKEW_SEC: ${JWT_CLOCK_SKEW_SEC:-30}
  AUTH_REFRESH_PREFIX: ${AUTH_REFRESH_PREFIX:-adatrack_gps:auth:refresh:}
  AUTH_DENYLIST_PREFIX: ${AUTH_DENYLIST_PREFIX:-adatrack_gps:auth:denylist:}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
  LOGIN_RATE_WINDOW_SEC: ${LOGIN_RATE_WINDOW_SEC:-900}
  LOGIN_LOCKOUT_THRESHOLD: ${LOGIN_LOCKOUT_THRESHOLD:-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
  # --- REST API limits (service-websocket + api-vehicle) ---
  API_RATE_LIMIT: ${API_RATE_LIMIT:-100}
  API_RATE_WINDOW_SEC: ${API_RATE_WINDOW_SEC:-60}
  API_DEFAULT_PAGE_SIZE: ${API_DEFAULT_PAGE_SIZE:-100}
  API_MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE:-1000}
  HISTORY_MAX_RANGE_DAYS: ${HISTORY_MAX_RANGE_DAYS:-90}
  API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-1048576}
  # --- WebSocket ---
  WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-5000}
  WS_SEND_BUFFER_BYTES: ${WS_SEND_BUFFER_BYTES:-262144}
  WS_MAX_QUEUE: ${WS_MAX_QUEUE:-1000}
  WS_PING_INTERVAL_SEC: ${WS_PING_INTERVAL_SEC:-30}
  WS_WRITE_TIMEOUT_SEC: ${WS_WRITE_TIMEOUT_SEC:-10}
  WS_PONG_TIMEOUT_SEC: ${WS_PONG_TIMEOUT_SEC:-60}
  WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES:-4096}
  WS_MAX_SUBSCRIPTIONS: ${WS_MAX_SUBSCRIPTIONS:-5000}
  # Origin dashboard yang boleh membuka WebSocket / CORS (dipisah koma).
  WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
  WS_ALLOW_EMPTY_ORIGIN: ${WS_ALLOW_EMPTY_ORIGIN:-false}
  # --- tenant & audit ---
  TENANT_ADMIN_EMAIL_DOMAIN: ${TENANT_ADMIN_EMAIL_DOMAIN:-local}
  PASSWORD_DEFAULT_TENANT_ADMIN: ${PASSWORD_DEFAULT_TENANT_ADMIN:-}
  AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
  AUDIT_QUEUE_SIZE: ${AUDIT_QUEUE_SIZE:-1000}
  AUDIT_BATCH_SIZE: ${AUDIT_BATCH_SIZE:-100}
  AUDIT_FLUSH_MS: ${AUDIT_FLUSH_MS:-1000}
  # --- retensi & migrasi otomatis (§11, §14.5) ---
  SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS:-180}
  MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-true}
  MIGRATE_LOCK_TIMEOUT_SEC: ${MIGRATE_LOCK_TIMEOUT_SEC:-60}
  MIGRATION_LEDGER_TABLE: ${MIGRATION_LEDGER_TABLE:-tm_schema_migrations}

services:
  # =========================================================================
  # Infra (internal-only; tidak ada port yang di-publish ke host)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Collation reproducible untuk seed referensi (kode wilayah BPS).
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap idempoten: schemas + master setup + template company (§14.5).
      - ../database/init-pg:/docker-entrypoint-initdb.d:ro
      - ../database/migrations:/db/migrations:ro
      - ../database/seed:/db/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [adatrack]

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "900 1"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [adatrack]

  nats:
    image: nats:2.10-alpine
    restart: always
    # JetStream wajib (PRD §4.1); limit file/memory ada di nats.conf.
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - natsdata:/data
      - ../deployments/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [adatrack]

  # =========================================================================
  # Pipeline services (B1) + B3
  # =========================================================================
  ingestion-tcp:
    build:
      context: ../
      dockerfile: services/ingestion-tcp/Dockerfile
    image: adatrack/ingestion-tcp:${IMAGE_TAG:-latest}
    restart: always
    environment: *app-env
    # SATU-SATUNYA service yang mem-publish port host: device GPS (GT06 /
    # Teltonika) connect TCP langsung, tidak lewat proxy HTTP Coolify.
    ports:
      - "${TCP_PORT:-9003}:${TCP_PORT:-9003}"
      - "${TELTONIKA_TCP_PORT:-9011}:${TELTONIKA_TCP_PORT:-9011}"
    expose:
      - "8090" # /healthz + /metrics (internal, di-scrape Prometheus)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${INGESTION_METRICS_ADDR#:}/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  worker-live:
    build:
      context: ../
      dockerfile: services/worker-live/Dockerfile
    image: adatrack/worker-live:${IMAGE_TAG:-latest}
    restart: always
    environment: *app-env
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${LIVE_METRICS_ADDR#:}/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  worker-persistence:
    build:
      context: ../
      dockerfile: services/worker-persistence/Dockerfile
    image: adatrack/worker-persistence:${IMAGE_TAG:-latest}
    restart: always
    environment: *app-env
    expose:
      - "8092"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PERSISTENCE_METRICS_ADDR#:}/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  # worker-alert (B3) — engine alarm: offline, fuel, geofence, route, speed.
  worker-alert:
    build:
      context: ../
      dockerfile: services/worker-alert/Dockerfile
    image: adatrack/worker-alert:${IMAGE_TAG:-latest}
    restart: always
    environment: *app-env
    expose:
      - "8094"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${ALERT_METRICS_ADDR#:}/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  # service-websocket (B2) — REST + WebSocket + RBAC + auth.
  service-websocket:
    build:
      context: ../
      dockerfile: services/service-websocket/Dockerfile
    image: adatrack/service-websocket:${IMAGE_TAG:-latest}
    restart: always
    environment: *app-env
    # expose saja: akses publik lewat proxy Coolify (isi kolom Domains dengan
    # port internal 8082). Mem-publish port di sini akan melewati proxy/TLS.
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${HTTP_ADDR#:}/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  # api-vehicle (B3) — REST fleet management: vehicles/geofences/routes/
  # speed-configs/alerts. JWT + denylist Redis HARUS sama dengan
  # service-websocket (dipakai dari x-app-env yang sama).
  api-vehicle:
    build:
      context: ../
      dockerfile: services/api-vehicle/Dockerfile
    image: adatrack/api-vehicle:${IMAGE_TAG:-latest}
    restart: always
    environment: *app-env
    # expose saja: akses publik lewat proxy Coolify (Domains + port internal 8081).
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${API_VEHICLE_HTTP_ADDR#:}/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  # =========================================================================
  # Monitoring (B4, §10.4) — internal-only.
  # Tanpa port host: dashboard Grafana diakses lewat proxy Coolify (isi kolom
  # Domains dengan port internal 3000 bila perlu). Prometheus memakai config
  # khusus container (prometheus.coolify.yml) yang men-scrape nama service,
  # bukan file_sd hasil generate host-run seperti di LOCAL.
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    expose:
      - "9090"
    volumes:
      - ../monitoring/prometheus/prometheus.coolify.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [adatrack]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    expose:
      - "9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    networks: [adatrack]

  grafana:
    image: grafana/grafana:11.1.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      # WAJIB dari secret Coolify (§7): jangan pakai placeholder .env.coolify.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    expose:
      - "3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [adatrack]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: always
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks: [adatrack]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: always
    privileged: true
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [adatrack]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?}?sslmode=${POSTGRES_SSLMODE:-disable}
    expose:
      - "9187"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [adatrack]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: always
    environment:
      REDIS_ADDR: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
    expose:
      - "9121"
    depends_on:
      redis: {condition: service_healthy}
    networks: [adatrack]

volumes:
  pgdata:
  redisdata:
  natsdata:
  promdata:
  alertdata:
  grafanadata:

networks:
  # Tanpa `name:` hardcoded — Coolify memberi prefix unik per resource sehingga
  # dua environment bisa berjalan di server yang sama tanpa saling bentrok.
  adatrack:
    driver: bridge
