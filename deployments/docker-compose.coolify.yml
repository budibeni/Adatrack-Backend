# ============================================================================
# ADATRACK — COOLIFY variant (production, PRD §7 + §14.1 + §14.5)
# ============================================================================
# Selected automatically by scripts/compose-up.sh when COMPOSE_VARIANT=coolify
# (or --provider coolify). Differences vs LOCAL:
#   * NO host port publishing for infra — everything stays on the internal
#     `adatrack_gps_net` network; Coolify's proxy publishes app services only.
#   * NO dev credential fallbacks: secrets MUST come from Coolify resources /
#     .env.coolify (${VAR:?err} fails fast instead of silently using dev values).
#   * App services built from the repo Dockerfiles (context = backend/), so the
#     migration artifacts (database/) travel inside the image (§14.5 step 1).
#   * MIGRATE_ON_BOOT=true + pre-deploy hook runs scripts/migrate.sh (§14.5).
#
# Monitoring (B4, PRD §10.4) is part of the stack — the same seven services the
# canonical docker-compose.yml defines — but here they are `expose`d on the
# internal network only (plus Grafana's admin password comes from a Coolify
# secret). Coolify's proxy maps a domain to the port when an operator needs the
# Grafana dashboard; nothing is published on the host by default.
#
# NEVER mix this file with .env.local (§7 "tidak ada config campuran").
# ============================================================================
name: adatrack_gps_prod

services:
  # ---------------------------------------------------------------------------
  # Infra (managed as Coolify resources; internal-only networking)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.coolify}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.coolify}
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init-pg:/docker-entrypoint-initdb.d:ro
      - ../database/migrations:/db/migrations:ro
      - ../database/seed:/db/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [adatrack]

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "900 1"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [adatrack]

  nats:
    image: nats:2.10-alpine
    restart: always
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - natsdata:/data
      - ../deployments/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [adatrack]

  # ---------------------------------------------------------------------------
  # Pipeline services (B1)
  # ---------------------------------------------------------------------------
  ingestion-tcp:
    build:
      context: ../
      dockerfile: services/ingestion-tcp/Dockerfile
    image: adatrack/ingestion-tcp:${IMAGE_TAG:-latest}
    restart: always
    env_file: [../.env.coolify]
    environment:
      MIGRATE_ON_BOOT: "true"
    expose:
      - "${TCP_PORT:-9003}"
      - "${TELTONIKA_TCP_PORT:-9011}"
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  worker-live:
    build:
      context: ../
      dockerfile: services/worker-live/Dockerfile
    image: adatrack/worker-live:${IMAGE_TAG:-latest}
    restart: always
    env_file: [../.env.coolify]
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8091/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  worker-persistence:
    build:
      context: ../
      dockerfile: services/worker-persistence/Dockerfile
    image: adatrack/worker-persistence:${IMAGE_TAG:-latest}
    restart: always
    env_file: [../.env.coolify]
    environment:
      MIGRATE_ON_BOOT: "true"
    expose:
      - "8092"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8092/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  # ---------------------------------------------------------------------------
  # service-websocket (B2) — REST + WebSocket + RBAC + auth
  # ---------------------------------------------------------------------------
  service-websocket:
    build:
      context: ../
      dockerfile: services/service-websocket/Dockerfile
    image: adatrack/service-websocket:${IMAGE_TAG:-latest}
    restart: always
    env_file: [../.env.coolify]
    environment:
      # Master migrations run on boot so the auth schema is always current
      # (§14.5 step 3); the JWT secret comes from Coolify secrets via .env.coolify.
      MIGRATE_ON_BOOT: "true"
    expose:
      - "${HTTP_ADDR_PORT:-8082}"
    ports:
      # The dashboard/WS client must reach this service through Coolify's proxy.
      - "${HTTP_ADDR_PORT:-8082}:${HTTP_ADDR_PORT:-8082}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${HTTP_ADDR_PORT:-8082}/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    networks: [adatrack]

  # ---------------------------------------------------------------------------
  # Monitoring stack (B4, PRD §10.4) — internal network only.
  #
  # Same services as the canonical docker-compose.yml; the differences are
  # deliberate and variant-specific:
  #   * `expose` instead of `ports` — nothing new is published on the host. The
  #     Coolify proxy maps a domain to Grafana's 3000 / Prometheus' 9090 when an
  #     operator actually needs the UI.
  #   * Grafana's admin password is a Coolify secret (${VAR:?} aborts a deploy
  #     that forgot it) instead of the LOCAL `admin` fallback.
  #   * Config is mounted from ../monitoring (this file lives in deployments/).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    expose:
      - "9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ../monitoring/targets:/etc/prometheus/targets:ro
      - promdata:/prometheus
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [adatrack]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    expose:
      - "9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    networks: [adatrack]

  grafana:
    image: grafana/grafana:11.1.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.coolify}
      GF_USERS_ALLOW_SIGN_UP: "false"
    expose:
      - "3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [adatrack]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: always
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # `$$` is required — Compose would otherwise interpolate $| itself.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks: [adatrack]

  cadvisor:
    # Container resource metrics (PRD §10.4). Needs the host cgroup/docker paths
    # and privileged access, which Coolify grants for a service defined here.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: always
    privileged: true
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [adatrack]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    environment:
      # Service-name DSN over the internal network, credentials from Coolify.
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env.coolify}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.coolify}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env.coolify}?sslmode=disable
    expose:
      - "9187"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [adatrack]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis: {condition: service_healthy}
    networks: [adatrack]

volumes:
  pgdata:
  redisdata:
  natsdata:
  promdata:
  alertdata:
  grafanadata:

networks:
  adatrack:
    name: adatrack_gps_net
    driver: bridge