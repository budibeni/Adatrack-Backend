# ============================================================================
# ADATRACK — NATS server configuration (JetStream, PRD §4.1 / §7.6)
# ============================================================================
# Mounted read-only by docker-compose.yml (LOCAL) and
# deployments/docker-compose.coolify.yml (COOLIFY):
#
#   command: ["-c", "/etc/nats/nats.conf"]
#
# Why explicit limits: JetStream refuses `MaxBytes` bigger than the store budget
# ("insufficient storage resources available"). Without these values the server
# derives the budget from free disk space, so a small dev volume silently blocks
# stream creation. Set max_file_store to comfortably exceed the sum of the
# stream retentions (JETSTREAM_MAX_BYTES, default 4 GiB per stream).
# ============================================================================

server_name: adatrack-nats
port: 4222

http: 8222

# Health probe used by the compose healthcheck (wget /healthz).

jetstream {
  store_dir: /data
  # Budget for file-backed streams: >= sum of stream MaxBytes (6 streams).
  # Kapasitas (2026-09-23): jumlah MaxBytes semua stream harus <= nilai ini, kalau
  # tidak `ensureStreams` menurunkan cap per stream bertahap (fail-safe, cap jadi
  # tidak seragam). 6 stream x 16 GiB = 96 GiB (JETSTREAM_MAX_BYTES endurance 24 jam
  # @400 msg/s: ~34,6 juta pesan x ~235 B ~ 8,1 GiB per stream) -> 100GB.
  # Bila JETSTREAM_MAX_BYTES diubah, nilai ini harus >= 6x lipatnya.
  max_file_store: 100GB
  # Metadata/dedup window in memory.
  max_memory_store: 1GB
  # Sync every 2 minutes instead of every message (throughput vs durability).
  sync_interval: 2m
}

# Bound per-connection resources so a single misbehaving client cannot exhaust
# the broker (PRD §9.6 DoS mitigation / FR-4.4 bounded buffers).
max_payload: 1048576
max_connections: 4096
write_deadline: "10s"

logtime: true
debug: false
trace: false