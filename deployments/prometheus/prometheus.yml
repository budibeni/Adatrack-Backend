global:
  scrape_interval: 15s

rule_files:
  - 'alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'adatrack-services'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/adatrack-services.json'
