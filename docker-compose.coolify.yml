version: '3.8'
services:
  postgres_db:
    build:
      context: ./database
      dockerfile: Dockerfile.postgres
    command: postgres -c max_connections=500
    container_name: adatrack_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
    - pgdata_v4:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - coolify
  redis:
    image: redis:7-alpine
    container_name: adatrack_redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
    - redisdata:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - coolify
  nats:
    image: nats:2.10-alpine
    container_name: adatrack_nats
    command:
    - -js
    - -sd
    - /data
    volumes:
    - natsdata:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8222/healthz
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - coolify
  minio:
    image: quay.io/minio/minio:latest
    container_name: adatrack_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
    - miniodata:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
    - coolify
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: adatrack_minio_setup
    restart: "no"
    exclude_from_hc: true
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/mc config host add myminio http://minio:9000 "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}";
        /usr/bin/mc rm -r --force myminio/"${S3_BUCKET_NAME}" || true;
        /usr/bin/mc mb myminio/"${S3_BUCKET_NAME}" || true;
        /usr/bin/mc anonymous set public myminio/"${S3_BUCKET_NAME}";
        exit 0;
    networks:
    - coolify
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.6.0
    container_name: adatrack_node_exporter
    restart: unless-stopped
    networks:
    - coolify
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: adatrack_cadvisor
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
    - coolify
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.12.0
    container_name: adatrack_postgres_exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?sslmode=disable
    depends_on:
    - postgres_db
    restart: unless-stopped
    networks:
    - coolify
  prometheus:
    build:
      context: .
      dockerfile: ./deployments/prometheus/Dockerfile
    container_name: adatrack_prometheus
    restart: unless-stopped
    networks:
    - coolify
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.25.0
    container_name: adatrack_alertmanager
    restart: unless-stopped
    networks:
    - coolify
  postgres-replica:
    image: postgis/postgis:15-3.3-alpine
    container_name: adatrack_postgres_replica
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    depends_on:
      postgres_db:
        condition: service_healthy
    command: 'sh -c '' rm -rf /var/lib/postgresql/data/*; until pg_isready -h postgres_db
      -p 5432 -U "${DB_USER}"; do sleep 2; done; PGPASSWORD="${DB_PASSWORD}" pg_basebackup
      -h postgres_db -U "${DB_USER}" -D /var/lib/postgresql/data -Fp -Xs -P -R; chown -R
      postgres:postgres /var/lib/postgresql/data; chmod 700 /var/lib/postgresql/data;
      exec su postgres -c "postgres -c max_connections=500" ''

      '
    networks:
    - coolify
  redis-replica:
    image: redis:7-alpine
    container_name: adatrack_redis_replica
    command: redis-server --replicaof redis 6379 --requirepass "${REDIS_PASSWORD}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - coolify
  migrate:
    build:
      context: .
      dockerfile: ./deployments/migrate/Dockerfile
    container_name: adatrack_migrate
    restart: "no"
    exclude_from_hc: true
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres_db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      PGHOST: postgres_db
      PGPORT: 5432
      MIGRATION_DIR: /app/database/migrations
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
    - coolify
  ingestion-tcp:
    build:
      context: .
      dockerfile: ./services/ingestion-tcp/Dockerfile
    container_name: adatrack_ingestion_tcp
    env_file:
    - .env.coolify
    networks:
    - coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
    - 5000-5030:5000-5030
    - 15000-15010:15000-15010
  api-vehicle:
    build:
      context: .
      dockerfile: ./services/api-vehicle/Dockerfile
    container_name: adatrack_api_vehicle
    env_file:
    - .env.coolify
    networks:
    - coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker-live:
    build:
      context: .
      dockerfile: ./services/worker-live/Dockerfile
    container_name: adatrack_worker_live
    env_file:
    - .env.coolify
    networks:
    - coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker-persistence:
    build:
      context: .
      dockerfile: ./services/worker-persistence/Dockerfile
    container_name: adatrack_worker_persistence
    env_file:
    - .env.coolify
    networks:
    - coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker-alert:
    build:
      context: .
      dockerfile: ./services/worker-alert/Dockerfile
    container_name: adatrack_worker_alert
    env_file:
    - .env.coolify
    networks:
    - coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  service-websocket:
    build:
      context: .
      dockerfile: ./services/service-websocket/Dockerfile
    container_name: adatrack_service_websocket
    env_file:
    - .env.coolify
    networks:
    - coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  foundation-check:
    build:
      context: .
      dockerfile: ./services/foundation-check/Dockerfile
    container_name: adatrack_foundation_check
    env_file:
    - .env.coolify
    networks:
    - coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  service-monitor:
    build:
      context: .
      dockerfile: ./services/service-monitor/Dockerfile
    container_name: adatrack_service_monitor
    env_file:
    - .env.coolify
    networks:
    - coolify
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
  grafana:
    build:
      context: .
      dockerfile: ./deployments/grafana/Dockerfile
    container_name: adatrack_grafana
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_SECURITY_ALLOW_EMBEDDING=true
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped
    networks:
    - coolify
volumes:
  pgdata_v4: null
  redisdata: null
  natsdata: null
  miniodata: null
networks:
  coolify:
    external: true
