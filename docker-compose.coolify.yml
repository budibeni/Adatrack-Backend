version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adatrack_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: adatrack_redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: adatrack_nats
    command: ["-js"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: adatrack_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: adatrack_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      /usr/bin/mc rm -r --force myminio/${S3_BUCKET_NAME} || true;
      /usr/bin/mc mb myminio/${S3_BUCKET_NAME} || true;
      /usr/bin/mc anonymous set public myminio/${S3_BUCKET_NAME};
      exit 0;
      "

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.6.0
    container_name: adatrack_node_exporter
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: adatrack_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.12.0
    container_name: adatrack_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      - postgres
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: adatrack_prometheus
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deployments/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - ./deployments/prometheus/targets:/etc/prometheus/targets
    restart: unless-stopped

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.25.0
    container_name: adatrack_alertmanager
    restart: unless-stopped

  postgres-replica:
    image: postgres:15-alpine
    container_name: adatrack_postgres_replica
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c '
      rm -rf /var/lib/postgresql/data/*;
      until pg_isready -h postgres -p 5432 -U ${DB_USER}; do sleep 2; done;
      PGPASSWORD="${DB_PASSWORD}" pg_basebackup -h postgres -U ${DB_USER} -D /var/lib/postgresql/data -Fp -Xs -P -R;
      chown -R postgres:postgres /var/lib/postgresql/data;
      chmod 700 /var/lib/postgresql/data;
      exec su postgres -c "postgres"
      '

  redis-replica:
    image: redis:7-alpine
    container_name: adatrack_redis_replica
    command: redis-server --replicaof redis 6379 --requirepass "${REDIS_PASSWORD}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
