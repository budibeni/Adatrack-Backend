# =====================================================================
# CI/CD — Phase B4.2 (GAP #7)
# Pipeline: build → lint → test → security scan (govulncheck) → build images
# Dijalankan pada setiap push ke main & pull request.
# =====================================================================
name: CI - Backend Adatrack GPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - path: internal
            name: internal
          - path: services/ingestion-tcp
            name: ingestion-tcp
          - path: services/worker-persistence
            name: worker-persistence
          - path: services/worker-live
            name: worker-live
          - path: services/service-websocket
            name: service-websocket
          - path: services/worker-alert
            name: worker-alert
          - path: services/api-vehicle
            name: api-vehicle

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      - name: Security scan
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
