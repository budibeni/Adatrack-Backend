# ============================================================================
# ADATRACK — LOCAL variant (development / staging, PRD §7 + §14.1)
# ============================================================================
# Selected automatically by scripts/compose-up.sh when COMPOSE_VARIANT=local
# (default). Extends the canonical stack with dev-only concerns:
#   * host ports bound to 127.0.0.1 (never exposed to the LAN) — infra AND
#     monitoring, every service published by docker-compose.yml
#   * MinIO runs by default (B5b media flow is exercised locally)
#
# The monitoring services come from the included canonical file; this file only
# re-binds their ports (see the `!override` note below), so there is no second
# compose file to layer with `-f` anymore.
#
# Usage:
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
# ============================================================================
name: adatrack_gps_system

include:
  - ./docker-compose.yml

services:
  # `!override` is mandatory here: Compose merges `ports` sequences by APPENDING,
  # so a plain re-declaration would leave BOTH the canonical 0.0.0.0 binding
  # (docker-compose.yml) and this loopback one for the same target port. Docker
  # then fails to program the endpoint, leaving the container with no published
  # port at all. `!override` replaces the inherited list instead.
  postgres:
    ports: !override
      - "127.0.0.1:${HOST_PG_PORT:-5533}:5432"

  redis:
    ports: !override
      - "127.0.0.1:${HOST_REDIS_PORT:-6380}:6379"

  nats:
    ports: !override
      - "127.0.0.1:${HOST_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${HOST_NATS_MONITOR_PORT:-8222}:8222"

  # ---------------------------------------------------------------------------
  # Monitoring (B4, PRD §10.4) — same `!override` reasoning as the infra above.
  # The canonical file publishes these on 0.0.0.0; this variant must never expose
  # Prometheus / Grafana / Alertmanager (unauthenticated by default) to the LAN.
  # ---------------------------------------------------------------------------
  prometheus:
    ports: !override
      - "127.0.0.1:${HOST_PROM_PORT:-9095}:9090"

  alertmanager:
    ports: !override
      - "127.0.0.1:${HOST_ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    ports: !override
      - "127.0.0.1:${HOST_GRAFANA_PORT:-3001}:3000"

  node-exporter:
    ports: !override
      - "127.0.0.1:${HOST_NODE_EXPORTER_PORT:-9100}:9100"

  cadvisor:
    ports: !override
      - "127.0.0.1:${HOST_CADVISOR_PORT:-8084}:8080"

  postgres-exporter:
    ports: !override
      - "127.0.0.1:${HOST_PG_EXPORTER_PORT:-9187}:9187"

  redis-exporter:
    ports: !override
      - "127.0.0.1:${HOST_REDIS_EXPORTER_PORT:-9121}:9121"

  # ---------------------------------------------------------------------------
  # MinIO — B5b Dashcam Event Media object storage (PRD Module 8 / FR-8.1).
  #
  # Defined in FULL here (no profile gate): compose `profiles` are additive, so
  # a `profiles: []` override cannot release a gate inherited from an included
  # file — LOCAL therefore owns the service outright and runs it by default,
  # while the canonical core stack (docker-compose.yml) and the Coolify variant
  # stay object-storage-free. API/console bind to loopback like every other
  # service in this variant; credentials come from MEDIA_S3_* in .env.local.
  # ---------------------------------------------------------------------------
  minio:
    # Pinned release, never `latest`: MinIO stopped publishing a `latest` tag
    # (the reference now lives on quay.io/minio/minio) and a floating tag would
    # make the media flow untestable across machines. Bump deliberately.
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: adatrack_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${HOST_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${HOST_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [adatrack]

volumes:
  miniodata:
